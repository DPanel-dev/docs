name: build-image
permissions: write-all
on: [push]
jobs:
  build:
    strategy:
      matrix:
        platform: [ ubuntu-latest]
        go-version: [ '1.22' ]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to ALiYun
        uses: docker/login-action@v3
        with:
          registry: registry.cn-hangzhou.aliyuncs.com
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_TOKEN }}
      - name: Login to ZPK
        uses: docker/login-action@v3
        with:
          registry: zpk.w7.cc
          username: ${{ secrets.ZPK_USERNAME }}
          password: ${{ secrets.ZPK_PASSWORD }}
      - name: Docker BuildX
        run: |
          SHORT_SHA="$(git rev-parse --short=9 HEAD)"
          docker buildx build \
          -t zpk.w7.cc/dpanel/dpanel:doc-${SHORT_SHA} \
          -t registry.cn-hangzhou.aliyuncs.com/dpanel/dpanel:doc \
          -t registry.cn-hangzhou.aliyuncs.com/dpanel/dpanel:doc-${SHORT_SHA} \
          --platform linux/amd64 \
          . --push
